name: CI

on:
  push:
    branches: [main]
  # Also run on pull requests, so problems show up before the merge instead of
  # after it. The push-image job stays main-only because of its own if.
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest
      - name: Build Docker image
        run: docker build -t hr-interview-system:${{ github.sha }} .
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hr-interview-system:${{ github.sha }}
          severity: CRITICAL,HIGH
          # Only fail on things we can actually do something about. The image
          # still has unfixed Debian CVEs with no patch released, and blocking
          # on those would break every build with no way to fix it.
          ignore-unfixed: true
          exit-code: '1'

  push-image:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # latest is convenient but it is a moving pointer - it cannot be
          # rolled back to. The commit sha tag is the one that identifies an
          # exact build, so a bad deploy can go back to a known good image.
          tags: |
            ghcr.io/chethanagimhan/hr-interview-system:latest
            ghcr.io/chethanagimhan/hr-interview-system:${{ github.sha }}

    
