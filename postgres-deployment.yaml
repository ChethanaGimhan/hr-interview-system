# Postgres for the local Kubernetes cluster.
#
# The password comes from a Secret instead of being written here, and the data
# lives on a PersistentVolumeClaim so it survives the pod being deleted or
# rescheduled. Create the secret before applying this file:
#
#   kubectl create secret generic postgres-secret \
#     --from-literal=POSTGRES_PASSWORD=<pick a password>

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: hr_interview
            # A mounted volume already has a lost+found directory in it, and
            # Postgres refuses to initialise into a non-empty directory, so
            # point it at a subdirectory of the mount instead.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
